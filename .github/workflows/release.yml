name: SAULUX Release

on:
  push:
    tags:
      - 'saulux-v*'

permissions:
  contents: read

concurrency:
  group: saulux-release
  cancel-in-progress: false

jobs:
  build:
    name: Build three SAULUX variants
    uses: ./.github/workflows/build.yml
    with:
      saulux_release: true

  release:
    name: Publish firmware release
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set release version
        run: python3 tools/saulux_release.py prepare "$GITHUB_REF_NAME"
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-SAULUX_*
          path: build_output/release
          merge-multiple: true
      - name: Validate binaries and create OTA manifest
        run: python3 tools/saulux_release.py package
      - name: Publish release in this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.bin dist/SHA256SUMS dist/manifest.json \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --latest
      - name: Upload OTA site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish OTA files to GitHub Pages
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy OTA site
        id: deployment
        uses: actions/deploy-pages@v4
