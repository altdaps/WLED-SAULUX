; Three firmware variants with preselected hardware profiles.
[platformio]
default_envs = saulux_2i2o, saulux_5i4o, saulux_ethernet

[saulux]
build_flags =
  ${common.build_flags}
  ${esp32_idf_V5.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -D SAULUX
  -D WLED_RELEASE_NAME=\"SAULUX\"
  -D WLED_USE_ETHERNET
  -D WLED_BRAND=\"SAULUX\"
  -D WLED_PRODUCT_NAME=\"SAULUX\"
  -D SERVERNAME=\"SAULUX\"
  -D WLED_REPO=\"altdaps/WLED-SAULUX\"
  -D SAULUX_OTA_BASE=\"https://altdaps.github.io/WLED-SAULUX\"
  -D BTNPIN=-1
  -D RLYPIN=-1
  -D WLED_DISABLE_INFRARED

[saulux_base]
extends = env:esp32dev
custom_usermods =
extra_scripts = ${scripts_defaults.extra_scripts}
  post:pio-scripts/saulux_factory.py
build_flags = ${saulux.build_flags}
build_unflags = ${esp32_idf_V5.build_unflags}
  -D WLED_ENABLE_DMX_INPUT

[env:saulux_2i2o]
extends = saulux_base
custom_saulux_release_name = SAULUX_2I2O
build_flags = ${saulux.build_flags}
  -D SAULUX_DEFAULT_MODEL=1

[env:saulux_5i4o]
extends = saulux_base
custom_saulux_release_name = SAULUX_5I4O
build_flags = ${saulux.build_flags}
  -D SAULUX_DEFAULT_MODEL=2

[env:saulux_ethernet]
extends = saulux_base
custom_saulux_release_name = SAULUX_ETHERNET
build_flags = ${saulux.build_flags}
  -D SAULUX_DEFAULT_MODEL=3
