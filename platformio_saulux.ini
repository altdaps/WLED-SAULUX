; Fixed hardware profiles, including WB-MGU on WB-MGE v.3 hardware.
[platformio]
default_envs = saulux_2i2o, saulux_5i4o, saulux_ethernet, wb_mgu

[saulux]
build_flags =
  ${common.build_flags}
  ${esp32_idf_V4.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -D SAULUX
  -D WLED_RELEASE_NAME=\"SAULUX_16\"
  -D WLED_USE_ETHERNET
  -D WLED_BRAND=\"SAULUX\"
  -D WLED_PRODUCT_NAME=\"SAULUX\"
  -D SERVERNAME=\"SAULUX\"
  -D WLED_REPO=\"altdaps/WLED-SAULUX\"
  -D SAULUX_OTA_BASE=\"https://altdaps.github.io/WLED-SAULUX\"
  -D BTNPIN=-1
  -D RLYPIN=-1
  -D WLED_DISABLE_INFRARED

[saulux_base]
extends = env:esp32dev
custom_usermods =
extra_scripts = ${scripts_defaults.extra_scripts}
  post:pio-scripts/saulux_factory.py
build_flags = ${saulux.build_flags}
build_unflags = ${esp32_idf_V4.build_unflags}
  -D WLED_ENABLE_DMX_INPUT

[env:saulux_2i2o]
extends = saulux_base
custom_saulux_release_name = SAULUX_2I2O
build_flags = ${saulux.build_flags}
  -D SAULUX_MODEL=1

[env:saulux_5i4o]
extends = saulux_base
custom_saulux_release_name = SAULUX_5I4O
build_flags = ${saulux.build_flags}
  -D SAULUX_MODEL=2

[env:saulux_ethernet]
extends = saulux_base
custom_saulux_release_name = SAULUX_ETHERNET
build_flags = ${saulux.build_flags}
  -D SAULUX_MODEL=3

[env:wb_mgu]
extends = saulux_base
custom_saulux_release_name = WB_MGU
board_build.flash_mode = dio
board_build.f_flash = 40000000L
build_flags = ${saulux.build_flags}
  -D SAULUX_MODEL=4
